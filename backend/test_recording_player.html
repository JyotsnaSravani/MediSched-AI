<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Recording Player</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .player-container {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        audio {
            width: 100%;
            margin: 10px 0;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <h1>🎵 Call Recording Test</h1>
    
    <div class="player-container">
        <h3>Test Recording Player</h3>
        <p>Testing call log ID: <strong id="callLogId">193</strong></p>
        
        <div id="status" class="status info">
            Loading recording...
        </div>
        
        <audio id="audioPlayer" controls preload="metadata">
            <source id="audioSource" src="/api/v1/calling/logs/193/recording/" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
        
        <div style="margin-top: 20px;">
            <button onclick="testRecording()">🔄 Reload Recording</button>
            <button onclick="testDifferentCall()">🔢 Test Different Call</button>
        </div>
    </div>
    
    <div class="player-container">
        <h3>Debug Information</h3>
        <div id="debugInfo"></div>
    </div>
    
    <script>
        const audioPlayer = document.getElementById('audioPlayer');
        const audioSource = document.getElementById('audioSource');
        const statusDiv = document.getElementById('status');
        const debugInfo = document.getElementById('debugInfo');
        
        // Test if recording URL is accessible
        async function testRecordingUrl(callLogId) {
            const url = `/api/v1/calling/logs/${callLogId}/recording/`;
            
            try {
                const response = await fetch(url, {
                    method: 'HEAD',
                    credentials: 'include'
                });
                
                if (response.ok) {
                    const contentType = response.headers.get('Content-Type');
                    const contentLength = response.headers.get('Content-Length');
                    
                    statusDiv.className = 'status success';
                    statusDiv.innerHTML = `✅ Recording found!<br>Type: ${contentType}<br>Size: ${(contentLength / 1024).toFixed(2)} KB`;
                    
                    debugInfo.innerHTML = `
                        <strong>URL:</strong> ${url}<br>
                        <strong>Status:</strong> ${response.status} ${response.statusText}<br>
                        <strong>Content-Type:</strong> ${contentType}<br>
                        <strong>Content-Length:</strong> ${contentLength} bytes<br>
                        <strong>CORS:</strong> ${response.headers.get('Access-Control-Allow-Origin') || 'Not set'}
                    `;
                } else {
                    statusDiv.className = 'status error';
                    statusDiv.innerHTML = `❌ Error: ${response.status} ${response.statusText}`;
                    
                    debugInfo.innerHTML = `
                        <strong>URL:</strong> ${url}<br>
                        <strong>Status:</strong> ${response.status} ${response.statusText}<br>
                        <strong>Error:</strong> Recording not found or not accessible
                    `;
                }
            } catch (error) {
                statusDiv.className = 'status error';
                statusDiv.innerHTML = `❌ Network error: ${error.message}`;
                
                debugInfo.innerHTML = `
                    <strong>URL:</strong> ${url}<br>
                    <strong>Error:</strong> ${error.message}<br>
                    <strong>Possible causes:</strong>
                    <ul>
                        <li>Backend server not running</li>
                        <li>CORS issue</li>
                        <li>Network connectivity problem</li>
                    </ul>
                `;
            }
        }
        
        function testRecording() {
            const callLogId = document.getElementById('callLogId').textContent;
            audioPlayer.load();
            testRecordingUrl(callLogId);
        }
        
        function testDifferentCall() {
            const newId = prompt('Enter call log ID to test:', '193');
            if (newId) {
                document.getElementById('callLogId').textContent = newId;
                audioSource.src = `/api/v1/calling/logs/${newId}/recording/`;
                testRecording();
            }
        }
        
        // Audio player event listeners
        audioPlayer.addEventListener('loadstart', () => {
            console.log('Audio loading started...');
        });
        
        audioPlayer.addEventListener('loadedmetadata', () => {
            console.log('Audio metadata loaded');
            console.log('Duration:', audioPlayer.duration, 'seconds');
        });
        
        audioPlayer.addEventListener('canplay', () => {
            console.log('Audio can play');
            statusDiv.className = 'status success';
            statusDiv.innerHTML = '✅ Recording ready to play!';
        });
        
        audioPlayer.addEventListener('error', (e) => {
            console.error('Audio error:', e);
            statusDiv.className = 'status error';
            statusDiv.innerHTML = `❌ Audio error: ${audioPlayer.error ? audioPlayer.error.message : 'Unknown error'}`;
        });
        
        // Test on page load
        window.addEventListener('load', () => {
            testRecordingUrl(193);
        });
    </script>
</body>
</html>
